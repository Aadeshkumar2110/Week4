<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Outfit:wght@100..900&family=Poppins:wght@500&display=swap"
      rel="stylesheet"
    />

    <style>
        .dashboard{
            display: grid;
            grid-template-columns: 1fr 375px;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
            gap: 2px;
        }
        .navb{
            grid-column: 1/3;
            /* border: 2px solid yellow; */
            text-align: center;
            font-size: 40px;
            color: #a29da3;
            background: linear-gradient(to bottom right, #b493c2, #821abf, #733483);
        }
        .dash{
            grid-column: 1;
        }
        .sidebar{
            grid-column: 2/3;
        }
        .dash-content{
            width: 100%;
            height: 200px;
        }
        .dash-content div h1{
            color: #fff;

        }
    </style>
  </head>
  <body>
    <section class="dashboard" id="dashboard">
        <div class="navb">
            Navbar
        </div>
        <main class="dash" style="background: linear-gradient(to bottom left, rgb(227, 155, 155), rgba(231, 129, 180, 0.438), rgb(207, 113, 113));">
            <div class="row p-3">
                <div class="col-lg-3 p-3 text-center d-flex gap-4 ">
                    <i class="fa-solid fa-house ps-4" style="color: #565156; font-size: 25px;"></i>
                    <h5 style="color: #9b77a4;">Dashboard</h5>
                </div>
                <div class="col-lg-6"></div>
                <div class="col-lg-3 text-center p-3 d-flex gap-2">
                    <p>overview </p>
                    <i class="fa-solid fa-circle-exclamation py-2" style="font-size: 10px;"></i>
                </div>
            </div>
            <div class="row p-3 gap-5 dash-content mx-3">
                <div class="col rounded ms-3" style="background: linear-gradient(120deg, rgb(225, 156, 156),rgb(232, 121, 189), rgb(142, 164, 182));">
                    <div class="dash-content-icon p-2 d-flex">
                        <h6 class="ps-2 pe-5 me-5 text-white" >Weekly Sales </h6>
                        <i class="fa-solid fa-chart-simple text-white ps-5" style="font-size: 28px;"></i>
                    </div>
                    <h1><span class="fa-solid fa-dollar-sign px-3 py-2"></span>15,0000 </h1>
                    <p class="ps-3 text-light py-1 ">Increased by 60%</p>
                </div>
                <div class="col rounded-2"  style="background: linear-gradient(360deg, rgb(95, 122, 229),rgb(105, 116, 188), rgb(11, 81, 138));">
                    <div class="dash-content-icon p-2 d-flex">
                        <h6 class="ps-2 pe-5 me-5 text-white" >Weekly Orders </h6>
                        <i class="fa-regular fa-bookmark text-white ps-5" style="font-size: 28px;"></i>
                    </div>
                    <h1 class="px-3 py-2">15000 </h1>
                    <p class="ps-3 text-light py-1 ">Decreased by 0%</p>
                </div>
                <div class="col rounded-2 me-5"  style="background: linear-gradient(200deg, rgb(177, 228, 125),rgb(22, 188, 17), rgb(139, 176, 82));">
                    <div class="dash-content-icon p-2 d-flex">
                        <h6 class="ps-2 pe-5 me-5 text-white">Visitors Online</h6>
                        <i class="fa-regular fa-gem text-white ps-5" style="font-size: 28px;"></i>
                    </div>
                    <h1 class="px-3 py-2">95,576 </h1>
                    <p class="ps-3 text-light py-1 ">Increased by 5%</p>
                </div>
            </div>
            <div class="row gap-3 p-5">
                <div class="col">
                    <img src="https://images.highfile.com/wp-content/uploads/2025/03/Budget-Analysis-Bar-Graph-Template-Google-Slides-PowerPoint.png?strip=all&lossy=1&quality=90&webp=90&sharp=1&ssl=1" alt="an" class="w-100 rounded-2 d-block">
                </div>
                <div class="col">
                    <img src="https://images.template.net/487477/Sales-Pie-Chart-Template-edit-online.png" alt="" class="w-100 h-100 rounded-2 d-block">
                </div>
            </div>
        </main>
        
        <div class="sidebar">
          <div class="" tabindex="-1" id="offcanvasTop">
            <div class="offcanvas-header">
              <div class="offcanvas-header-item d-flex text-center">
                <div class="offcanvas-header-item-content">
                  <i class="fa-solid fa-circle-user"></i>
                </div>
                <div class="offcanvas-header-item-content">
                  <h6>Colorlib</h6>
                  <p>Software</p>
                </div>
              </div>
              <button class="btn-close text-reset" type="button" data-bs-dismiss="offcanvas"
                aria-label="close"></button>
            </div>
            <div class="offcanvas-body">
              <div class="input-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search..." />
              </div>
              <div class="offcanvas-content">
                <ul class="offcanvas-content" type="none">
                  <li class="offcanvas-content-item">
                    <a href="#" type="button" data-bs-target="#dashboard">
                      <i class="fa-solid fa-house"></i>
                      <h5>Dashboard</h5>
                    </a>
                  </li>
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-chart-simple"></i>
                      <h5>Revenue</h5>
                    </a>
                  </li>
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-bell"></i>
                      <h5>Notifications</h5>
                    </a>
                  </li>
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-chart-pie"></i>
                      <h5>Analytics</h5>
                    </a>
                  </li>
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-heart"></i>
                      <h5>Likes</h5>
                    </a>
                  </li>
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-wallet"></i>
                      <h5>Wallets</h5>
                    </a>
                  </li>
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-gear"></i>
                      <h5>Settings</h5>
                    </a>
                  </li>
                  <hr style="width: 100%" />
                  <li class="offcanvas-content-item">
                    <a href="">
                      <i class="fa-solid fa-right-from-bracket"></i>
                      <h5>Logout</h5>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
    </section>
  </body>
</html>
